name: PianoCore tests

on:
  pull_request:
    paths: ["PianoCore/**", ".github/workflows/pianocore.yml"]
  push:
    branches: [master]
    paths: ["PianoCore/**"]

jobs:
  test:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path PianoCore
