# XcodeGen spec. Make the project with: xcodegen generate (in this folder).
name: Piano
options:
  bundleIdPrefix: io.arjunkhera
  deploymentTarget:
    iOS: "17.0"
packages:
  PianoCore:
    path: ../PianoCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Piano:
    type: application
    platform: iOS
    sources: [PianoApp]
    dependencies:
      - package: PianoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.arjunkhera.piano
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Piano
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
